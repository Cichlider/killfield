<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Killfield</title>
<meta name="description" content="Play against Killfield or watch Laika, Hybrid, and Killfield duel in the browser.">
<link rel="icon" type="image/png" sizes="48x48" href="assets/brand/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=d54b36ce">
</head>
<body>
<main>
  <header>
    <h1>killfield</h1>
    <button id="lang-toggle" type="button" class="quiet" aria-label="Switch to Chinese">中文</button>
  </header>

  <nav class="mode-switch" aria-label="Mode">
    <button id="mode-watch" type="button" class="mode-btn active">Watch</button>
    <button id="mode-play" type="button" class="mode-btn">Play</button>
  </nav>

  <section class="config-row watch-config" id="watch-config" aria-label="Watch match">
    <label class="select-field role-red"><span id="watch-left-label">Left</span>
      <select id="controller-0"><option value="hybrid" selected>Hybrid</option><option value="laika">Laika</option><option value="killfield">Killfield</option></select>
    </label>
    <span class="versus">vs</span>
    <label class="select-field role-black"><span id="watch-right-label">Right</span>
      <select id="controller-1"><option value="laika" selected>Laika</option><option value="hybrid">Hybrid</option><option value="killfield">Killfield</option></select>
    </label>
  </section>

  <section class="stage" id="stage">
    <div class="stage-overlay">
      <div class="scoreboard">
        <div class="side"><span class="swatch" id="swatch-0"></span><span class="side-name" id="name-0">Hybrid</span><strong class="side-score" id="score-0">0</strong></div>
        <span class="vs">vs</span>
        <div class="side side-right"><strong class="side-score" id="score-1">0</strong><span class="side-name" id="name-1">Laika</span><span class="swatch" id="swatch-1"></span></div>
      </div>
      <p class="roundline" id="roundline">round 1</p>
      <p class="streakline" id="streakline">win streak 0 · best 0</p>
    </div>
    <div class="canvas-wrap">
      <canvas id="screen" width="712" height="500"></canvas>
      <div class="stage-toolbar" aria-label="Game controls">
        <button id="touch-visibility" type="button" class="icon-btn" aria-label="Hide touch controls" hidden>CTRL</button>
        <button id="sound" type="button" class="icon-btn" aria-label="Mute sound"></button>
        <button id="pause" type="button" class="icon-btn" aria-label="Pause"></button>
        <button id="fullscreen" type="button" class="icon-btn" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
    <div id="touch-controls" class="touch-controls" hidden>
      <div class="control-style-switch" role="group" aria-label="Touch control style">
        <button id="control-style-joystick" type="button">Joystick</button>
        <button id="control-style-dpad" type="button">Forward / turn</button>
      </div>
      <div class="touch-left-control">
        <div id="touch-joystick" class="touch-joystick" role="application" aria-label="128-direction movement joystick">
          <span class="joystick-axis axis-n">▲</span><span class="joystick-axis axis-e">▶</span>
          <span class="joystick-axis axis-s">▼</span><span class="joystick-axis axis-w">◀</span>
          <span id="touch-knob" class="touch-knob"></span>
        </div>
        <div id="touch-dpad" class="touch-dpad" role="group" aria-label="Forward, reverse, left and right">
          <button type="button" class="dpad-up" data-control="forward" aria-label="Forward">▲</button>
          <button type="button" class="dpad-left" data-control="turnLeft" aria-label="Turn left">◀</button>
          <button type="button" class="dpad-right" data-control="turnRight" aria-label="Turn right">▶</button>
          <button type="button" class="dpad-down" data-control="backup" aria-label="Reverse">▼</button>
        </div>
      </div>
      <button id="touch-fire" type="button" class="touch-fire">FIRE</button>
    </div>
    <div id="orientation-hint" class="orientation-hint" role="status" hidden>
      <span class="orientation-phone" aria-hidden="true"></span>
      <strong id="orientation-title">Rotate your phone</strong>
      <span id="orientation-body">Turn off portrait lock, then rotate to landscape.</span>
    </div>
  </section>

  <section class="config-row play-config" id="play-config" hidden aria-label="Player match settings">
    <label class="select-field role-black"><span id="play-opponent-label">Opponent</span>
      <select id="play-opponent"><option value="laika">Laika</option><option value="hybrid" selected>Hybrid</option><option value="killfield">Killfield</option></select>
    </label>
    <button id="instant-turn" type="button" aria-pressed="false" class="toggle">No turn-rate limit: off</button>
    <label class="range-field"><span id="forward-alignment-label">Wheel forward region</span><input id="forward-alignment" type="range" min="0" max="360" step="2.8125" value="270"><output id="forward-alignment-value" for="forward-alignment">270°</output></label>
    <label class="select-field" id="reaction-delay-field"><span id="reaction-delay-label">Opponent delay</span><select id="reaction-delay"><option value="0">0 frames</option><option value="1">1 frame</option><option value="2">2 frames</option><option value="3">3 frames</option></select></label>
    <label class="range-field" id="opening-delay-field"><span id="opening-delay-label">Opening pause</span><input id="opening-delay" type="range" min="0" max="3" step="0.1" value="0.5"><output id="opening-delay-value" for="opening-delay">0.5 s</output></label>
  </section>

  <div class="actions"><button id="reroll" type="button" class="ghost-btn">New maze</button><button id="reset-score" type="button" class="ghost-btn">Reset score</button></div>
</main>
<script type="module" src="viewer.js?v=23fc0df0"></script>
</body>
</html>
