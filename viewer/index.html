<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Killfield</title>
<meta name="description" content="Play against Killfield or watch Laika, Hybrid, and Killfield duel in the browser.">
<link rel="icon" type="image/png" sizes="48x48" href="assets/brand/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/brand/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=e6110971">
</head>
<body>
<main>
  <header>
    <h1>killfield</h1>
    <button id="lang-toggle" type="button" class="quiet" aria-label="Switch to Chinese">中文</button>
  </header>

  <nav class="mode-switch" aria-label="Mode">
    <button id="mode-watch" type="button" class="mode-btn active">Watch</button>
    <button id="mode-play" type="button" class="mode-btn">Play</button>
  </nav>

  <section class="config-row watch-config" id="watch-config" aria-label="Watch match">
    <div class="controller-picker role-red" data-theme-picker data-select-id="controller-0" data-label-id="watch-left-label">
      <span id="watch-left-label">Left</span>
      <button type="button" class="controller-trigger" aria-haspopup="listbox" aria-expanded="false"><span>Hybrid</span><i aria-hidden="true"></i></button>
      <div class="controller-menu" role="listbox" aria-hidden="true">
        <button type="button" role="option" data-value="hybrid" aria-selected="true">Hybrid</button>
        <button type="button" role="option" data-value="laika" aria-selected="false">Laika</button>
        <button type="button" role="option" data-value="killfield" aria-selected="false">Killfield</button>
      </div>
      <select id="controller-0" class="native-controller-select" tabindex="-1" aria-hidden="true"><option value="hybrid" selected>Hybrid</option><option value="laika">Laika</option><option value="killfield">Killfield</option></select>
    </div>
    <span class="versus">vs</span>
    <div class="controller-picker role-black" data-theme-picker data-select-id="controller-1" data-label-id="watch-right-label">
      <span id="watch-right-label">Right</span>
      <button type="button" class="controller-trigger" aria-haspopup="listbox" aria-expanded="false"><span>Laika</span><i aria-hidden="true"></i></button>
      <div class="controller-menu" role="listbox" aria-hidden="true">
        <button type="button" role="option" data-value="laika" aria-selected="true">Laika</button>
        <button type="button" role="option" data-value="hybrid" aria-selected="false">Hybrid</button>
        <button type="button" role="option" data-value="killfield" aria-selected="false">Killfield</button>
      </div>
      <select id="controller-1" class="native-controller-select" tabindex="-1" aria-hidden="true"><option value="laika" selected>Laika</option><option value="hybrid">Hybrid</option><option value="killfield">Killfield</option></select>
    </div>
  </section>

  <section class="stage" id="stage">
    <div class="stage-overlay">
      <div class="scoreboard">
        <div class="side"><span class="swatch" id="swatch-0"></span><span class="side-name" id="name-0">Hybrid</span><strong class="side-score" id="score-0">0</strong></div>
        <span class="vs">vs</span>
        <div class="side side-right"><strong class="side-score" id="score-1">0</strong><span class="side-name" id="name-1">Laika</span><span class="swatch" id="swatch-1"></span></div>
      </div>
      <p class="roundline" id="roundline">round 1</p>
      <p class="streakline" id="streakline">win streak 0 · best 0</p>
    </div>
    <div class="canvas-wrap">
      <canvas id="screen" width="712" height="500"></canvas>
      <div class="stage-toolbar" aria-label="Game controls">
        <button id="touch-visibility" type="button" class="icon-btn" aria-label="Hide touch controls" hidden>CTRL</button>
        <button id="sound" type="button" class="icon-btn" aria-label="Mute sound"></button>
        <button id="pause" type="button" class="icon-btn" aria-label="Pause"></button>
        <button id="fullscreen" type="button" class="icon-btn" aria-label="Fullscreen">⛶</button>
      </div>
    </div>
    <div id="touch-controls" class="touch-controls" hidden>
      <div class="touch-left-control">
        <div id="touch-joystick" class="touch-joystick" role="application" aria-label="128-direction movement joystick">
          <span id="touch-knob" class="touch-knob"></span>
        </div>
      </div>
      <button id="touch-fire" type="button" class="touch-fire">FIRE</button>
    </div>
    <div id="orientation-hint" class="orientation-hint" role="status" hidden>
      <span class="orientation-phone" aria-hidden="true"></span>
      <strong id="orientation-title">Rotate your phone</strong>
      <span id="orientation-body">Turn off portrait lock, then rotate to landscape.</span>
    </div>
  </section>

  <section class="config-row play-config" id="play-config" hidden aria-label="Player match settings">
    <div class="controller-picker role-black" data-theme-picker data-select-id="play-opponent" data-label-id="play-opponent-label">
      <span id="play-opponent-label">Opponent</span>
      <button type="button" class="controller-trigger" aria-haspopup="listbox" aria-expanded="false"><span>Hybrid</span><i aria-hidden="true"></i></button>
      <div class="controller-menu" role="listbox" aria-hidden="true">
        <button type="button" role="option" data-value="laika" aria-selected="false">Laika</button>
        <button type="button" role="option" data-value="hybrid" aria-selected="true">Hybrid</button>
        <button type="button" role="option" data-value="killfield" aria-selected="false">Killfield</button>
      </div>
      <select id="play-opponent" class="native-controller-select" tabindex="-1" aria-hidden="true"><option value="laika">Laika</option><option value="hybrid" selected>Hybrid</option><option value="killfield">Killfield</option></select>
    </div>
    <button id="instant-turn" type="button" aria-pressed="false" class="toggle">No turn-rate limit: off</button>
    <label class="range-field"><span id="forward-alignment-label">Wheel forward region</span><input id="forward-alignment" type="range" min="0" max="360" step="2.8125" value="270"><output id="forward-alignment-value" for="forward-alignment">270°</output></label>
    <div class="controller-picker" id="reaction-delay-field" data-theme-picker data-select-id="reaction-delay" data-label-id="reaction-delay-label">
      <span id="reaction-delay-label">Opponent delay</span>
      <button type="button" class="controller-trigger" aria-haspopup="listbox" aria-expanded="false"><span>0 frames</span><i aria-hidden="true"></i></button>
      <div class="controller-menu" role="listbox" aria-hidden="true">
        <button type="button" role="option" data-value="0" aria-selected="true">0 frames</button>
        <button type="button" role="option" data-value="1" aria-selected="false">1 frame</button>
        <button type="button" role="option" data-value="2" aria-selected="false">2 frames</button>
        <button type="button" role="option" data-value="3" aria-selected="false">3 frames</button>
      </div>
      <select id="reaction-delay" class="native-controller-select" tabindex="-1" aria-hidden="true"><option value="0">0 frames</option><option value="1">1 frame</option><option value="2">2 frames</option><option value="3">3 frames</option></select>
    </div>
    <label class="range-field" id="opening-delay-field"><span id="opening-delay-label">Opening pause</span><input id="opening-delay" type="range" min="0" max="3" step="0.1" value="0.5"><output id="opening-delay-value" for="opening-delay">0.5 s</output></label>
  </section>

  <div class="actions"><button id="reroll" type="button" class="ghost-btn">New maze</button><button id="reset-score" type="button" class="ghost-btn">Reset score</button></div>
  <footer class="site-footer"><a href="https://github.com/Cichlider/killfield" target="_blank" rel="noreferrer">github.com/Cichlider/killfield</a><span>© 2026 Cichlider. All rights reserved.</span></footer>
</main>
<script type="module" src="viewer.js?v=05f9d3db"></script>
</body>
</html>
