<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Killfield · 对战</title>
<link rel="icon" href="assets/brand/favicon-48.png">
<style>
:root {
  --bg: #faf9f7; --ink: #1a1c1f; --mut: #6b7280; --line: #e5e7eb; --card: #fff;
  --wall: #3f4550; --me: #17191c; --target: #9e101b;
  --threat: #d82432; --mine: #2563eb; --ground: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131517; --ink: #e8eaed; --mut: #9aa3ad; --line: #2c3035; --card: #1c1f22;
    --wall: #8b93a1; --me: #e8eaed; --ground: #202327;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px; background: var(--bg); color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
}
h1 { font-size: 18px; margin: 0 0 2px; }
.sub { color: var(--mut); font-size: 13px; margin-bottom: 18px; }
.wrap { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
#stage {
  background: var(--ground); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px; line-height: 0;
  /* Sized by the script from the measured box, never by flex. */
  flex: 0 0 auto;
}
canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; }
.panel {
  flex: 1 1 240px; min-width: 240px; max-width: 340px;
  /* Height is capped from the script to the same budget the canvas gets, so
     a tall panel scrolls itself instead of pushing the page into a scroll and
     taking the canvas out of view with it. */
  overflow-y: auto;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 12px; margin-bottom: 10px;
}
.card:last-child { margin-bottom: 0; }
.card h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--mut); margin: 0 0 7px; font-weight: 600; }
.row { display: flex; justify-content: space-between; padding: 2px 0; font-size: 13.5px; }
.row b { font-variant-numeric: tabular-nums; }
button {
  font: inherit; font-size: 13.5px; padding: 5px 10px; border-radius: 7px;
  cursor: pointer; border: 1px solid var(--line); background: var(--card);
  color: var(--ink); margin: 0;
}
/* One labelled row per control group, so adding a button never silently costs
   the canvas another line of height. */
.group { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.group:first-of-type { margin-top: 0; }
.group span { color: var(--mut); font-size: 11px; width: 30px; flex: none; }
button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:disabled { opacity: .45; cursor: default; }
.legend { font-size: 12px; color: var(--mut); line-height: 1.45; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  margin-right: 6px; vertical-align: -1px; }
#note { color: var(--mut); font-size: 12px; margin-top: 8px; }

/* Live-model plumbing. The banner exists because a mismatched checkpoint used
   to render silently, so it is loud on purpose. */
#alarm {
  margin: 0 0 14px; padding: 10px 14px; border-radius: 8px;
  background: #7f1d1d; color: #fee2e2; border: 1px solid #b91c1c;
  font-size: 13px; line-height: 1.5; white-space: pre-line;
}
#m-fresh {
  margin-top: 7px; padding: 5px 8px; border-radius: 6px;
  background: #1e3a8a; color: #dbeafe; font-size: 12px; text-align: center;
}
</style>
</head>
<body>
<h1>Killfield · 对战</h1>
<div class="sub" id="sub">每局随机迷宫 · 双方均可开火 · 30 秒未分胜负判平</div>
<div id="alarm" hidden></div>

<div class="wrap">
  <div id="stage"><canvas id="screen" width="640" height="640"></canvas></div>

  <div class="panel">
    <div class="card">
      <h2>控制</h2>
      <div class="group"><span>驾驶</span>
        <button id="mode-mpc" class="active">MPC 基准</button>
        <button id="mode-ppo">PPO 策略</button>
      </div>
      <div class="group"><span>对手</span>
        <button id="opp-laika" class="active">Laika</button>
        <button id="opp-mpc">MPC</button>
      </div>
      <div class="group"><span></span>
        <button id="pause">暂停</button>
        <button id="restart">换一局</button>
      </div>
    </div>

    <div class="card">
      <h2>本局</h2>
      <div class="row"><span>结果</span><b id="s-reward">进行中</b></div>
      <div class="row"><span>开火数</span><b id="s-kills">0</b></div>
      <div class="row"><span>对手</span><b id="s-dodges">Laika</b></div>
      <div class="row"><span>剩余时间</span><b id="s-time">30.0s</b></div>
      <div class="row"><span>状态</span><b id="s-alive">存活</b></div>
    </div>

    <div class="card">
      <h2>当前模型</h2>
      <div class="row"><span>来源</span><b id="m-source">—</b></div>
      <div class="row"><span>训练步数</span><b id="m-steps">—</b></div>
      <div class="row"><span>schema</span><b id="m-schema">—</b></div>
      <div id="m-fresh" hidden>新模型已就绪，本局结束后切换</div>
    </div>

    <div class="card">
      <h2>历史（本次会话）</h2>
      <div class="row"><span>回合数</span><b id="h-eps">0</b></div>
      <div class="row"><span>胜 / 负</span><b id="h-mean">—</b></div>
      <div class="row"><span>双亡 / 平</span><b id="h-best">—</b></div>
      <div class="row"><span>胜率</span><b id="h-death">—</b></div>
    </div>

    <div class="card legend">
      <div><i style="background:var(--me)"></i>本方（被评估的智能体）</div>
      <div><i style="background:var(--target)"></i>对手（会移动、会开枪）</div>
      <div><i style="background:var(--threat)"></i>威胁子弹（会致命）</div>
      <div><i style="background:var(--mine)"></i>己方子弹（未反弹前无害）</div>
      <div id="note"></div>
    </div>
  </div>
</div>

<script type="module" src="viewer.js?v=ed0f2626"></script>
</body>
</html>
