[package]
name = "kf_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "kf_engine"
crate-type = ["rlib", "cdylib"]

[features]
# Native builds normally skip `wasm.rs`; this pulls it back in for tools
# (e.g. `paper/tools/record_replay.py`) that need the single-instance
# render/step API from a native .dylib rather than a browser wasm32 build.
record = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
