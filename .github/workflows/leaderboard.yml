name: Verify a leaderboard record

# Anyone on the internet can open an issue, so this workflow runs on untrusted
# input while holding a token that can write to the repository. The issue body
# is therefore passed to the verifier through the environment and parsed in
# Node — never interpolated into a `run:` block, which would let a crafted
# record execute commands here. Nothing the submitter controls reaches a shell.
on:
  issues:
    # One automatic attempt per issue. Allowing `edited` made it possible to
    # rerun a near-60,000-frame replay indefinitely by editing one public
    # issue; a rejected player can open a fresh issue after correcting it.
    # Gateway Issues arrive already labelled. The manual fallback arrives
    # unlabelled and only runs after a maintainer deliberately adds the label;
    # ordinary users therefore cannot bypass the gateway to spend Actions.
    types: [opened, labeled]

# One at a time: the board is a file in the repo, and two runs appending to it
# at once would race. This also bounds what a burst of submissions can spend.
concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  verify:
    # An API-created gateway Issue can also emit a `labeled` event. Run it on
    # `opened` only; manual records have no marker and run when a maintainer
    # adds the label. This prevents duplicate verifier jobs for one Issue.
    if: >-
      contains(github.event.issue.labels.*.name, 'leaderboard') &&
      ((github.event.action == 'opened' && contains(github.event.issue.body, '<!-- killfield-gateway:v1:')) ||
       (github.event.action == 'labeled' && github.event.label.name == 'leaderboard' && !contains(github.event.issue.body, '<!-- killfield-gateway:v1:')))
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The replay processes public input. Do not leave a write credential
          # in its checkout; authenticate only after verification succeeded.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replay the record
        id: replay
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Issues created by the one-click Worker are attributed to this
          # service account. Only those Issues may carry a gateway rate key.
          LEADERBOARD_GATEWAY_AUTHOR: Cichlider
        run: node tools/verify_replay.mjs --write

      - name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file comment.md

      - name: Commit the board
        if: steps.replay.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/leaderboard.json
          git commit -m "Add a verified leaderboard record"
          git push

      - name: Close the issue
        if: steps.replay.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --reason completed

      - name: Fail the run when the record was rejected
        if: steps.replay.outcome != 'success'
        run: exit 1

  # Pages is built from two branches — the player from main, the paper from rl
  # — so a commit to main cannot simply reuse deploy-paper.yml, which only
  # fires on pushes to rl. This composes the identical artifact rather than
  # reaching across branches to trigger that workflow. The `pages` concurrency
  # group is shared with it so the two can never deploy over each other.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the player, board included, from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Read the paper from rl
        uses: actions/checkout@v4
        with:
          ref: rl
          path: paper-source

      - name: Compose one Pages artifact
        run: |
          cp -R paper-source/paper site/paper
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
