name: Deploy to GitHub Pages

# This repo has no build step — it's static ES modules served as-is. We still
# publish through an explicit Actions workflow (rather than the legacy
# branch-source Pages pipeline) because the legacy path runs two separate
# deployment trackers in parallel and they occasionally wedge each other:
# a stuck "building" record on one blocks every later "deployment_queued"
# attempt until someone manually cancels it via the API. A single workflow
# with cancel-in-progress concurrency has one pipeline, so there's nothing
# left to wedge.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
