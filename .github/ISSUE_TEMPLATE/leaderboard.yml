name: Leaderboard record
description: Manual fallback for maintainers and troubleshooting
title: "[score] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        The game normally submits a qualifying run with one click. This form is
        the manual fallback for maintainers and troubleshooting. A maintainer
        must add the `leaderboard` label after checking the request before the
        verifier will run.

        The record is the seed and every frame of your input — not a score.
        CI replays it through the same engine build and works the score out for
        itself, so there is nothing to fill in by hand and nothing worth editing.
  - type: textarea
    id: record
    attributes:
      label: Record
      description: Paste the bare record JSON. Do not add code fences; this box adds its own.
      render: json
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        A bot will reply with the verdict. If it disagrees with what the page
        told you, the replay is what counts — say so in a comment and it can be
        looked at.
